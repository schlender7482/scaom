services:
  # Servidor Web Nginx
  nginx:
    image: nginx:alpine
    container_name: scaom_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - scaom_network

  # PHP-FPM com extensões necessárias
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: scaom_php
    volumes:
      - ./src:/var/www/html
    networks:
      - scaom_network

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: scaom_postgres
    environment:
      POSTGRES_DB: scaom_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: A@nderqw1995
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scaom_network

  # pgAdmin (opcional - interface gráfica para o banco)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scaom_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: andersonrafaelschlender@gmail.com
      PGADMIN_DEFAULT_PASSWORD: A@nderqw1995
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - scaom_network

networks:
  scaom_network:
    driver: bridge

volumes:
  postgres_data: